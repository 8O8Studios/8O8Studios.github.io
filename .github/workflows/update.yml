name: Update data

on:
  schedule:
    - cron: "5-55/5 * * * *"
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full refresh (all items)"
        type: boolean
        default: false

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update data.json
        run: |
          if [ "${{ github.event.schedule }}" = "0 * * * *" ] || [ "${{ inputs.full }}" = "true" ]; then
            node scripts/update.mjs
          else
            node scripts/update.mjs --quick
          fi

      - name: Commit if changed
        run: |
          if git diff --quiet -- data.json; then
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Update data.json"
            git pull --rebase
            git push
          fi
