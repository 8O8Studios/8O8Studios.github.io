<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UGC Groups</title>
<style>
:root{
  --bg:#f5f5f5; --tile:#e3e3e3; --text:#000; --muted:#595959; --line:#cfcfcf;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#1e1e1e; --tile:#0c0c0c; --text:#fff; --muted:#a3a3a3; --line:#333;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif}
a{color:inherit}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px clamp(16px,4vw,48px);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:1.25rem;font-weight:700}
button{font:inherit;color:var(--text);background:transparent;border:1px solid var(--text);padding:6px 14px;cursor:pointer}
button:hover{background:var(--text);color:var(--bg)}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
nav{display:flex;flex-wrap:wrap;gap:8px 20px;padding:16px clamp(16px,4vw,48px)}
nav a{color:var(--muted);text-decoration:none}
nav a:hover{color:var(--text);text-decoration:underline}
main{padding:0 clamp(16px,4vw,48px) 64px}
section.group{padding-top:40px;scroll-margin-top:8px}
section.group>h2{margin:0 0 4px;font-size:1.75rem}
section.group>h2 a{text-decoration:none}
section.group>h2 a:hover{text-decoration:underline}
h3{margin:28px 0 12px;font-size:1rem;font-weight:700}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity}
.tile{flex:0 0 168px;scroll-snap-align:start;background:var(--tile);padding:10px;text-decoration:none;display:block}
.tile:hover{outline:1px solid var(--text)}
.tile .img{aspect-ratio:1;width:100%;display:block;object-fit:contain;background:transparent}
.tile .ph{aspect-ratio:1;width:100%}
.tile .name{margin:8px 0 2px;font-size:.9rem;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.tile .fav{font-size:.85rem;color:var(--muted)}
.msg{padding:48px 0;color:var(--muted)}
footer{padding:0 clamp(16px,4vw,48px) 32px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<header>
  <h1>UGC Groups</h1>
  <button id="theme" type="button" aria-label="Switch between light and dark mode">Dark mode</button>
</header>
<nav id="nav" aria-label="Groups"></nav>
<main id="main"><p class="msg">Loading…</p></main>
<footer id="foot"></footer>
<script>
const root = document.documentElement;
const btn = document.getElementById("theme");
function setTheme(t){
  root.dataset.theme = t;
  btn.textContent = t === "dark" ? "Light mode" : "Dark mode";
  try { localStorage.setItem("theme", t); } catch (e) {}
}
let saved = null;
try { saved = localStorage.getItem("theme"); } catch (e) {}
setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
btn.addEventListener("click", () => setTheme(root.dataset.theme === "dark" ? "light" : "dark"));

function el(tag, props = {}, ...kids){
  const n = Object.assign(document.createElement(tag), props);
  kids.forEach(k => n.append(k));
  return n;
}

function tile(item){
  const a = el("a", { className: "tile", href: "https://www.roblox.com/catalog/" + item.id, target: "_blank", rel: "noopener" });
  a.append(item.image ? el("img", { className: "img", src: item.image, alt: item.name, loading: "lazy" }) : el("div", { className: "ph" }));
  a.append(el("div", { className: "name", textContent: item.name }));
  a.append(el("div", { className: "fav", textContent: "★ " + Number(item.favorites).toLocaleString() }));
  return a;
}

function row(title, items){
  const frag = document.createDocumentFragment();
  frag.append(el("h3", { textContent: title }));
  const r = el("div", { className: "row" });
  items.forEach(i => r.append(tile(i)));
  frag.append(r);
  return frag;
}

fetch("data.json").then(r => r.json()).then(data => {
  const main = document.getElementById("main");
  const nav = document.getElementById("nav");
  main.textContent = "";
  if (!data.groups.length) {
    main.append(el("p", { className: "msg", textContent: "No items yet. In your repository, open Actions, choose “Update items”, and click Run workflow." }));
    return;
  }
  data.groups.forEach(g => {
    nav.append(el("a", { href: "#g" + g.id, textContent: g.name }));
    const s = el("section", { className: "group", id: "g" + g.id });
    s.append(el("h2", {}, el("a", { href: "https://www.roblox.com/communities/" + g.id, target: "_blank", rel: "noopener", textContent: g.name })));
    s.append(row("Latest arrivals", g.latest));
    s.append(row("Best selling", g.bestSelling));
    s.append(row("Top favorited", g.favorited));
    main.append(s);
  });
  if (data.updated) document.getElementById("foot").textContent = "Updated " + new Date(data.updated).toLocaleString();
}).catch(() => {
  document.getElementById("main").innerHTML = '<p class="msg">Could not load data.json.</p>';
});
</script>
</body>
</html>
